[project]
name = "chrona"
version = "0.2.0"
description = "Reference-video rendering service for a persistent procedural world"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "langgraph>=1.0,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
inference = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers>=5,<6",
  "accelerate>=1.10",
  "diffusers",
  "av>=14",
  "imageio-ffmpeg>=0.6",
  "scipy>=1.15",
  "soundfile>=0.13",
  "einops>=0.8",
  "peft>=0.18,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chrona"]

[tool.hatch.build.targets.wheel.force-include]
"harness" = "chrona/resources/harness"
"configs" = "chrona/resources/configs"
"locales" = "chrona/resources/locales"
"contracts/compatibility" = "chrona/resources/contracts/compatibility"

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "d42ebf9c6e0b46103b74283f5324357a67acaa04" }
